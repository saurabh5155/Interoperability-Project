---
# Deny all ingress/egress by default in the interop namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: interop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# API Gateway: accept ingress from the Ingress controller and the internet;
# allow egress to all internal services and external EHR endpoints
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}   # allow from everywhere (internet-facing)
  egress:
    - {}   # allow to everywhere (proxies to services + external)

---
# EHR Registration Service: only reachable from api-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ehr-registration-service
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: ehr-registration-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - ports:  # allow DNS
        - protocol: UDP
          port: 53

---
# Subscription Service: reachable from api-gateway and routing-engine
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: subscription-service
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: subscription-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    - from:
        - podSelector:
            matchLabels:
              app: routing-engine
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: UDP
          port: 53

---
# Routing Engine: reachable from api-gateway only (ingest endpoint)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routing-engine
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: routing-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: subscription-service
    - to:
        - podSelector:
            matchLabels:
              app: mapping-service
    - to:
        - podSelector:
            matchLabels:
              app: dynamic-adapter-service
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - ports:
        - protocol: UDP
          port: 53

---
# Internal services: reachable only from routing-engine or mapping-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dynamic-adapter-service
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: dynamic-adapter-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: routing-engine
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: TCP
          port: 443  # outbound to external EHR APIs (HTTPS)
        - protocol: TCP
          port: 80
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mapping-service
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: mapping-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: routing-engine
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: fhir-canonical-service
    - to:
        - podSelector:
            matchLabels:
              app: context-resolver-service
    - to:
        - podSelector:
            matchLabels:
              app: dynamic-adapter-service
    - to:
        - podSelector:
            matchLabels:
              app: validation-service
    - ports:
        - protocol: TCP
          port: 443  # Anthropic API
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-service
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: audit-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    - from:
        - podSelector:
            matchLabels:
              app: kafka
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - ports:
        - protocol: UDP
          port: 53

---
# Infrastructure: postgres, redis, kafka — only reachable from app pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: interop
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
