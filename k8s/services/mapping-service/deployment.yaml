apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapping-service
  namespace: interop
  labels:
    app: mapping-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mapping-service
  template:
    metadata:
      labels:
        app: mapping-service
        version: v1
    spec:
      containers:
        - name: mapping-service
          image: ghcr.io/your-org/mapping-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: interop-config
            - secretRef:
                name: interop-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: mapping-service
  namespace: interop
spec:
  selector:
    app: mapping-service
  ports:
    - port: 8085
      targetPort: 8085
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mapping-service-hpa
  namespace: interop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mapping-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
