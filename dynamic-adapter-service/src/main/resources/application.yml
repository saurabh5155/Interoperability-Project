server:
  port: 8084

spring:
  application:
    name: dynamic-adapter-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

services:
  ehr-registration:
    url: ${EHR_REGISTRATION_SERVICE_URL:http://ehr-registration-service:8081}

resilience4j:
  circuitbreaker:
    instances:
      ehr-delivery:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      ehr-delivery:
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
