apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: interop
  labels:
    app: audit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: audit-service
          image: ghcr.io/your-org/audit-service:latest
          ports:
            - name: http
              containerPort: 8089
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: interop-config
            - secretRef:
                name: interop-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            failureThreshold: 18
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: interop
spec:
  selector:
    app: audit-service
  ports:
    - port: 8089
      targetPort: 8089
