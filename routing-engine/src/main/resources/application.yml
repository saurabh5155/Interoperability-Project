server:
  port: 8083

spring:
  application:
    name: routing-engine
  webflux:
    # Reject ingest payloads larger than 1 MB at the codec level.
    # Prevents a single oversized EHR payload from consuming heap across
    # all downstream services (FHIR, mapping, adapter) simultaneously.
    codecs:
      max-in-memory-size: 1MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

routing:
  status-cache:
    ttl-minutes: ${ROUTING_STATUS_CACHE_TTL_MINUTES:60}

services:
  subscription-service:
    url: ${SUBSCRIPTION_SERVICE_URL:http://subscription-service:8082}
  mapping-service:
    url: ${MAPPING_SERVICE_URL:http://mapping-service:8085}

resilience4j:
  circuitbreaker:
    instances:
      pipeline-executor:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      pipeline-executor:
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}
  traces:
    exporter: otlp
  metrics:
    exporter: none

logging:
  pattern:
    level: "%5p [%X{traceId:-},${X{spanId:-}}]"
