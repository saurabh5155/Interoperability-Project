# DO NOT COMMIT ACTUAL VALUES — use sealed-secrets or external-secrets operator
apiVersion: v1
kind: Secret
metadata:
  name: interop-secrets
  namespace: interop
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_IN_CI"
  REDIS_PASSWORD: "REPLACE_IN_CI"
  ANTHROPIC_API_KEY: "REPLACE_IN_CI"
  # base64-encoded 32-byte key: openssl rand -base64 32
  AES_ENCRYPTION_KEY: "REPLACE_IN_CI"
  # random string >= 32 chars: openssl rand -hex 32
  JWT_SECRET: "REPLACE_IN_CI"
  # bcrypt hash of admin password: htpasswd -bnBC 12 "" "password" | tr -d ':\n'
  ADMIN_PASSWORD_HASH: "REPLACE_IN_CI"
  ADMIN_USERNAME: "admin"
