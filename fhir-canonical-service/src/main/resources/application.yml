server:
  port: 8086

spring:
  application:
    name: fhir-canonical-service

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}
  traces:
    exporter: otlp
  metrics:
    exporter: none

logging:
  pattern:
    level: "%5p [%X{traceId:-},${X{spanId:-}}]"
