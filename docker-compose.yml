version: '3.9'

# ─── Infrastructure ─────────────────────────────────────────────────────────
x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: interop_db
  POSTGRES_USER: interop_user
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:?AES_ENCRYPTION_KEY must be set to a base64-encoded 32-byte key}
  # CORS: override in production with actual frontend domains
  ADMIN_PORTAL_ORIGIN: ${ADMIN_PORTAL_ORIGIN:-http://localhost:3001}
  EHR_PORTAL_ORIGIN: ${EHR_PORTAL_ORIGIN:-http://localhost:3000}

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interop_db
      POSTGRES_USER: interop_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interop_user -d interop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Zookeeper ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  # ─── Kafka ──────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Kafka Topics Init ──────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic interop.audit --replication-factor 1 --partitions 4 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic interop.route --replication-factor 1 --partitions 8 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic interop.dlq --replication-factor 1 --partitions 2 &&
        echo 'Kafka topics created'
      "

  # ─── API Gateway ────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      EHR_REGISTRATION_HOST: ehr-registration-service
      ROUTING_ENGINE_HOST: routing-engine
      SUBSCRIPTION_SERVICE_HOST: subscription-service
      AUDIT_SERVICE_HOST: audit-service
    depends_on:
      - redis
    restart: unless-stopped

  # ─── EHR Registration Service ───────────────────────────────────────────
  ehr-registration-service:
    build:
      context: .
      dockerfile: ehr-registration-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Subscription Service ───────────────────────────────────────────────
  subscription-service:
    build:
      context: .
      dockerfile: subscription-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Routing Engine ─────────────────────────────────────────────────────
  routing-engine:
    build:
      context: .
      dockerfile: routing-engine/Dockerfile
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      MAPPING_SERVICE_URL: http://mapping-service:8085
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Dynamic Adapter Service ────────────────────────────────────────────
  dynamic-adapter-service:
    build:
      context: .
      dockerfile: dynamic-adapter-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      EHR_REGISTRATION_SERVICE_URL: http://ehr-registration-service:8081
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Mapping Service ────────────────────────────────────────────────────
  mapping-service:
    build:
      context: .
      dockerfile: mapping-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      FHIR_CANONICAL_SERVICE_URL: http://fhir-canonical-service:8086
      CONTEXT_RESOLVER_SERVICE_URL: http://context-resolver-service:8087
      DYNAMIC_ADAPTER_SERVICE_URL: http://dynamic-adapter-service:8084
      VALIDATION_SERVICE_URL: http://validation-service:8088
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── FHIR Canonical Service ─────────────────────────────────────────────
  fhir-canonical-service:
    build:
      context: .
      dockerfile: fhir-canonical-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
    restart: unless-stopped

  # ─── Context Resolver Service ───────────────────────────────────────────
  context-resolver-service:
    build:
      context: .
      dockerfile: context-resolver-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      EHR_REGISTRATION_SERVICE_URL: http://ehr-registration-service:8081
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Validation Service ─────────────────────────────────────────────────
  validation-service:
    build:
      context: .
      dockerfile: validation-service/Dockerfile
    ports:
      - "8088:8088"
    restart: unless-stopped

  # ─── Audit Service ──────────────────────────────────────────────────────
  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    ports:
      - "8089:8089"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Admin Portal ───────────────────────────────────────────────────────
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped

  # ─── EHR Self-Registration Portal ───────────────────────────────────────
  ehr-portal:
    build:
      context: ./ehr-portal
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: interop-network
